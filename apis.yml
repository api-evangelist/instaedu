name: InstaEDU
description: InstaEDU was an online, on-demand tutoring platform founded in 2011 in San Francisco that
  connected students with tutors for live one-on-one help across a range of academic subjects. Backed by
  Battery Ventures and Social Capital, the company was acquired by Chegg in 2014 and folded into the Chegg
  Tutors service, which Chegg subsequently wound down in 2021. There is no independent InstaEDU developer
  program, public API, developer portal, or live domain today (instaedu.com no longer resolves) — this
  profile is retained as a historical portfolio lead in the API Evangelist network.
